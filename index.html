<html lang="zh-CN">
<head>

<style>
  html { -webkit-text-size-adjust: 100%; background: #05070f; }
  *, *::before, *::after { box-sizing: border-box; }

  /* 边缘流光 Border Beam（01）：用 @property 让渐变角度可插值，光才会沿描边跑起来 */
  @property --beam-angle {
    syntax: "<angle>";
    inherits: false;
    initial-value: 0deg;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding:
      max(20px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    overflow-x: hidden;
    /* 底色只留在 html 上：body 再铺一层不透明底会把 .bg/.grid/.stars（z-index 负值）盖死 */
    background: transparent;
    color: #e2e8f0;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* 背景：纯 CSS 径向渐变，替代原来的 filter: blur(130px) 巨型光球（移动端 GPU 开销高） */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    transform-origin: 50% 40%;
    animation: breathe 26s ease-in-out infinite alternate;
    will-change: transform;
    background:
      radial-gradient(34vmax 34vmax at 4% -10%, rgba(139, 92, 246, .30), transparent 62%),
      radial-gradient(38vmax 38vmax at 108% 110%, rgba(34, 211, 238, .22), transparent 62%),
      radial-gradient(70vmax 44vmax at 50% -20%, rgba(99, 102, 241, .14), transparent 70%),
      radial-gradient(70vmax 70vmax at 50% 130%, rgba(76, 29, 149, .18), transparent 72%);
  }
  @keyframes breathe {
    from { transform: scale(1) translateY(0); }
    to   { transform: scale(1.07) translateY(-1.5%); }
  }

  /* 点阵：给空旷的页面一点结构感，离卡片越远越淡（纯 background，零额外请求） */
  .grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image: radial-gradient(rgba(148, 163, 184, .20) 1px, transparent 1px);
    background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(58% 48% at 50% 45%, #000 0%, transparent 88%);
    mask-image: radial-gradient(58% 48% at 50% 45%, #000 0%, transparent 88%);
  }

  /* 星点：平铺渐变，替代 1100px 宽的 box-shadow 星带（手机上大半在视口外） */
  .stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: .6;
    background-image:
      radial-gradient(1.4px 1.4px at 24px 32px, #fff, transparent 100%),
      radial-gradient(1px 1px at 132px 84px, rgba(255, 255, 255, .85), transparent 100%),
      radial-gradient(1.6px 1.6px at 228px 166px, rgba(255, 255, 255, .7), transparent 100%),
      radial-gradient(1px 1px at 92px 204px, rgba(255, 255, 255, .6), transparent 100%),
      radial-gradient(1.2px 1.2px at 300px 46px, rgba(255, 255, 255, .55), transparent 100%);
    background-size: 360px 260px;
    background-repeat: repeat;
    -webkit-mask-image: radial-gradient(120% 90% at 50% 35%, #000 40%, transparent 100%);
    mask-image: radial-gradient(120% 90% at 50% 35%, #000 40%, transparent 100%);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    padding: clamp(28px, 7vw, 38px) clamp(20px, 6vw, 32px);
    text-align: center;
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 26px;
    /* 聚光 Spotlight（02）：高光跟指针走，写成背景层就不会盖住文字 */
    --mx: 50%;
    --my: -25%;
    background:
      radial-gradient(320px circle at var(--mx) var(--my), rgba(167, 139, 250, .18), transparent 70%),
      linear-gradient(180deg, rgba(24, 28, 46, .82), rgba(10, 13, 24, .9));
    box-shadow:
      0 30px 70px -30px rgba(0, 0, 0, .95),
      inset 0 1px 0 rgba(255, 255, 255, .07);
    animation: enter .62s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(10px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  /* 一圈光沿卡片描边循环跑，亮度克制，只勾边不抢内容 */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: conic-gradient(
      from var(--beam-angle),
      transparent 0deg,
      transparent 205deg,
      rgba(167, 139, 250, 0) 235deg,
      rgba(167, 139, 250, .85) 300deg,
      rgba(34, 211, 238, .9) 338deg,
      transparent 360deg
    );
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    animation: beam 7s linear infinite;
    pointer-events: none;
  }
  @keyframes beam { to { --beam-angle: 360deg; } }

  .logo-wrap {
    position: relative;
    display: inline-block;
    line-height: 0;
  }
  .logo-wrap::after {
    content: "";
    position: absolute;
    inset: -11px;
    border: 1px solid rgba(139, 92, 246, .35);
    border-radius: 34px;
    animation: ring 2.8s ease-out infinite;
    pointer-events: none;
  }
  .logo {
    display: block;
    width: 88px;
    height: 88px;
    border-radius: 22px;
    box-shadow: 0 14px 34px -10px rgba(139, 92, 246, .6), 0 0 0 1px rgba(255, 255, 255, .1);
  }
  @keyframes ring {
    0%   { opacity: .8; transform: scale(.94); }
    70%  { opacity: 0;  transform: scale(1.06); }
    100% { opacity: 0;  transform: scale(1.06); }
  }

  h1 {
    margin: 20px 0 0;
    font-size: clamp(1.62rem, 6.6vw, 2.05rem);
    font-weight: 700;
    letter-spacing: .01em;
    background: linear-gradient(180deg, #fff 35%, rgba(226, 232, 240, .68));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    margin: 7px 0 0;
    font-size: .82rem;
    letter-spacing: .12em;
    color: #7c8698;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    padding: 10px 15px;
    max-width: 100%;
    border: 1px solid rgba(139, 92, 246, .3);
    border-radius: 999px;
    background: rgba(139, 92, 246, .10);
    font-size: .82rem;
    line-height: 1.45;
    color: #c4b5fd;
    transition: color .25s, background-color .25s, border-color .25s;
  }
  .status .dot {
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 0 4px rgba(167, 139, 250, .16);
    animation: pulse 1.7s ease-in-out infinite;
  }
  .status.ok   { color: #6ee7b7; border-color: rgba(52, 211, 153, .32); background: rgba(52, 211, 153, .10); }
  .status.warn { color: #fcd34d; border-color: rgba(251, 191, 36, .30); background: rgba(251, 191, 36, .09); }
  .status.error{ color: #fca5a5; border-color: rgba(248, 113, 113, .28); background: rgba(248, 113, 113, .09); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .45; transform: scale(.82); }
  }
  /* 弹性 Spring（13）：状态切换时有一下轻微回弹，比纯淡入更有反馈 */
  .status.pop { animation: spring .46s cubic-bezier(.34, 1.46, .5, 1) both; }
  @keyframes spring {
    0%   { transform: scale(.9); }
    62%  { transform: scale(1.035); }
    100% { transform: scale(1); }
  }

  .bar {
    display: none;
    height: 2px;
    margin: 12px auto 0;
    width: 132px;
    overflow: hidden;
    border-radius: 2px;
    background: rgba(255, 255, 255, .07);
  }
  .bar.show { display: block; }
  .bar span {
    display: block;
    width: 45%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, #a78bfa, #22d3ee, transparent);
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(300%); }
  }

  .detail {
    margin: 14px 0 0;
    min-height: 1.6em;
    font-size: .72rem;
    line-height: 1.7;
    color: #5b6478;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 26px;
  }
  .btn {
    flex: 1 1 140px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 18px;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 13px;
    background: rgba(255, 255, 255, .05);
    color: #cbd5e1;
    font: inherit;
    font-size: .82rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .2s, border-color .2s, color .2s, transform .15s;
  }
  .btn:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
  .btn:disabled {
    opacity: .45;
    cursor: default;
    transform: none;
  }
  .btn-primary {
    border-color: rgba(139, 92, 246, .45);
    background: linear-gradient(180deg, rgba(139, 92, 246, .3), rgba(139, 92, 246, .16));
    color: #ede9fe;
  }
  .btn[hidden] { display: none; }
  /* 同一 WiFi 下走局域网，比隧道快两个数量级 */
  .btn-lan {
    flex: 1 1 100%;
    border-color: rgba(52, 211, 153, .38);
    background: linear-gradient(180deg, rgba(16, 185, 129, .2), rgba(16, 185, 129, .1));
    color: #a7f3d0;
  }
  /* 电脑端离线时的退路：资讯走静态快照，永远打得开 */
  .btn-offline {
    flex: 1 1 100%;
    border-color: rgba(34, 211, 238, .4);
    background: linear-gradient(180deg, rgba(34, 211, 238, .22), rgba(34, 211, 238, .1));
    color: #a5f3fc;
  }

  /* 悬停上浮 Hover Lift（15）：只给精确指针设备，触屏不会卡住浮起态 */
  @media (hover: hover) and (pointer: fine) {
    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, .1);
      color: #fff;
      box-shadow: 0 14px 28px -18px rgba(0, 0, 0, .95);
    }
    .btn-primary:hover {
      background: linear-gradient(180deg, rgba(139, 92, 246, .42), rgba(139, 92, 246, .24));
      color: #fff;
    }
    .btn-offline:hover {
      background: linear-gradient(180deg, rgba(34, 211, 238, .32), rgba(34, 211, 238, .16));
      color: #cffafe;
      box-shadow: 0 14px 28px -18px rgba(34, 211, 238, .6);
    }
    .btn-lan:hover {
      background: linear-gradient(180deg, rgba(16, 185, 129, .3), rgba(16, 185, 129, .16));
      color: #d1fae5;
      box-shadow: 0 14px 28px -18px rgba(16, 185, 129, .55);
    }
    .btn:disabled:hover {
      transform: none;
      background: rgba(255, 255, 255, .05);
      color: #cbd5e1;
      box-shadow: none;
    }
  }
  .btn:active { transform: translateY(0) scale(.985); }

  /* 流光 Shimmer（10）：一道光周期性扫过高亮按钮，提示"这里最快" */
  .btn-shine {
    position: relative;
    overflow: hidden;
  }
  .btn-shine::after {
    content: "";
    position: absolute;
    top: -60%;
    bottom: -60%;
    left: 0;
    width: 62px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .22), transparent);
    transform: translateX(-90px) skewX(-18deg);
    animation: shimmer 5.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%, 56%   { transform: translateX(-90px) skewX(-18deg); }
    92%, 100% { transform: translateX(560px) skewX(-18deg); }
  }

  .hint {
    margin: 18px 0 0;
    font-size: .7rem;
    line-height: 1.7;
    color: #454e60;
  }

  @media (max-width: 360px) {
    .logo { width: 76px; height: 76px; border-radius: 19px; }
    .logo-wrap::after { inset: -9px; border-radius: 28px; }
    .status { font-size: .78rem; padding: 9px 13px; }
    .btn { flex-basis: 100%; font-size: .8rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>

  <main class="card">
    <div class="logo-wrap">
      <img class="logo" src="icon-192.png" width="88" height="88" alt="Sryaestart" fetchpriority="high" decoding="async">
    </div>

    <h1>Sryaestart</h1>
    <p class="sub">看板直达 · 自动连接</p>

    <div class="status" id="statusWrap">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText" role="status" aria-live="polite">正在连接你的看板…</span>
    </div>

    <div class="bar" id="bar" aria-hidden="true"><span></span></div>
    <p class="detail" id="detail"></p>

    <div class="actions">
      <a class="btn btn-lan btn-shine" id="lanBtn" href="#" hidden>⚡ 同一 WiFi 秒开</a>
      <a class="btn btn-offline" id="offlineBtn" href="app/">📰 离线看资讯</a>
      <button class="btn btn-primary" id="retry" type="button">立即重试</button>
      <a class="btn" href="https://sryae07.github.io/starwaves/">打开项目主页</a>
    </div>

    <p class="hint">电脑端 Sryaestart 启动后会自动进入，无需刷新页面<br>电脑端离线时，点「离线看资讯」仍可查看最近的游戏动态</p>
    <noscript>
      <p class="detail">需要启用 JavaScript 才能自动连接，也可以直接打开上面的项目主页。</p>
    </noscript>
  </main>

<script>
(function () {
  "use strict";

  /* 固定域名的具名隧道（cloudflared named tunnel），地址永远不变。
     留空字符串则只走 current-server.json 里的一次性地址。 */
  var FIXED_BASE = "https://dash.sryae07.dpdns.org";
  var POINTER_URL = "current-server.json";
  var PROBE_TIMEOUT = 5000;
  /* 国内到 Cloudflare 边缘有时要 8~12 秒，短超时会把它误判成离线 */
  var FIXED_PROBE_TIMEOUT = 6000;
  var RETRY_DELAY = 5000;
  var STORE_KEY = "sryaestart_server";

  var el = {
    wrap: document.getElementById("statusWrap"),
    text: document.getElementById("statusText"),
    detail: document.getElementById("detail"),
    bar: document.getElementById("bar"),
    retry: document.getElementById("retry"),
    lan: document.getElementById("lanBtn")
  };

  var attempt = 0;
  var settled = false;
  var timer = null;
  var busy = false;

  function readStore() {
    try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; }
  }
  function writeStore(value) {
    try { localStorage.setItem(STORE_KEY, value); } catch (e) { /* 隐私模式下忽略 */ }
  }

  function setState(kind, text, detail) {
    el.wrap.className = "status" + (kind ? " " + kind : "");
    el.text.textContent = text;
    el.detail.textContent = detail || "";
    el.bar.classList.toggle("show", kind === "busy");
    el.retry.disabled = kind === "busy";

    /* 弹性 Spring（13）：重放一次回弹动画，让状态切换有"落点" */
    el.wrap.classList.remove("pop");
    void el.wrap.offsetWidth;
    el.wrap.classList.add("pop");
  }

  function schedule(ms) {
    clearTimeout(timer);
    timer = setTimeout(run, ms);
  }

  function preconnect(base) {
    try {
      var origin = new URL(base).origin;
      if (!origin || document.querySelector('link[data-preconnect="' + origin + '"]')) return;
      var link = document.createElement("link");
      link.rel = "preconnect";
      link.href = origin;
      link.crossOrigin = "";
      link.setAttribute("data-preconnect", origin);
      document.head.appendChild(link);
    } catch (e) { /* ignore */ }
  }

  function safeUrl(value) {
    if (typeof value !== "string") return null;
    var url = value.trim().replace(/\/+$/, "");
    return /^https?:\/\/[^\s]+$/i.test(url) ? url : null;
  }

  function fetchPointer() {
    var controller = typeof AbortController === "function" ? new AbortController() : null;
    var timerId = controller ? setTimeout(function () { controller.abort(); }, 6000) : null;

    var request = fetch(POINTER_URL + "?t=" + Date.now(), {
      cache: "no-store",
      signal: controller ? controller.signal : undefined
    }).then(function (response) {
      return response.ok ? response.json() : null;
    }).then(function (data) {
      return {
        url: safeUrl(data && data.url),
        lan: safeUrl(data && data.lan)
      };
    }).catch(function () {
      return { url: null, lan: null };
    });

    if (!timerId) return request;
    return request.then(function (value) {
      clearTimeout(timerId);
      return value;
    }, function (error) {
      clearTimeout(timerId);
      throw error;
    });
  }

  /* 用一张图片验证服务是否真的活着：图片能解码 = 隧道与后端都通 */
  function probe(base, timeout) {
    return new Promise(function (resolve) {
      var img = new Image();
      var done = false;
      var timeoutId = setTimeout(function () { finish(false); }, timeout || PROBE_TIMEOUT);

      function finish(ok) {
        if (done) return;
        done = true;
        clearTimeout(timeoutId);
        img.onload = img.onerror = null;
        img.src = "data:,";
        resolve(ok);
      }

      img.onload = function () { finish(true); };
      img.onerror = function () { finish(false); };
      /* 探针只要一张极小的图：隧道只有约 15KB/s，拿 44KB 的图标当探针等于每次多等 3 秒 */
    img.src = base + "/assets/icon-96.webp?t=" + Date.now();
    });
  }

  /* 电脑和手机在同一个 WiFi 时，直连局域网地址几乎瞬开。
     注意：HTTPS 页面无法探测 http:// 内网地址（混合内容会被拦），
     所以这里只提供一个点了就走的一级跳转. */
  function showLan(base) {
    if (!el.lan) return;
    el.lan.href = base + "/dashboard";
    el.lan.hidden = false;
  }

  function goTo(base) {
    settled = true;
    clearTimeout(timer);
    writeStore(base);
    setState("ok", "已连接，正在进入看板…", base.replace(/^https?:\/\//, ""));
    /* 电脑在线时进 GitHub Pages 上的静态看板：外壳由 Pages 直出（0.2s 级），
       数据再走隧道，比整页穿隧道快得多。 */
    location.replace(location.origin + "/board/");
  }

  async function run() {
    if (settled || busy) return;
    busy = true;
    clearTimeout(timer);
    attempt += 1;

    try {
      if (navigator.onLine === false) {
        setState("warn", "当前没有网络连接", "恢复网络后会自动继续");
        return;
      }

      setState(
        "busy",
        attempt === 1 ? "正在连接你的看板…" : "正在重试连接（第 " + attempt + " 次）",
        FIXED_BASE ? "正在连接固定地址 · 最长约 12 秒" : "正在解析最新服务器地址"
      );

      /* 顺带拉 current-server.json：里面有局域网地址就把「秒开」按钮亮出来 */
      var pointerReady = fetchPointer().then(function (info) {
        if (info && info.lan) showLan(info.lan);
        return info;
      });

      var cached = readStore();
      var candidates = [];
      function add(url) {
        if (url && candidates.indexOf(url) === -1) candidates.push(url);
      }

      /* 固定域名的隧道优先：DNS 不通会立刻失败，不占时间 */
      add(FIXED_BASE);
      if (candidates.length) preconnect(candidates[0]);

      for (var i = 0; i < candidates.length; i++) {
        if (await probe(candidates[i], FIXED_PROBE_TIMEOUT)) {
          goTo(candidates[i]);
          return;
        }
      }

      /* 固定域名没通，再退回 current-server.json 里的一次性地址 */
      add(cached);
      var info = await pointerReady;
      add(info && info.url);

      for (var j = 0; j < candidates.length; j++) {
        if (j === 0 && FIXED_BASE) continue; /* 刚试过 */
        if (await probe(candidates[j])) {
          goTo(candidates[j]);
          return;
        }
      }

      if (!candidates.length) {
        setState("warn", "暂时没有可用的服务器地址", "电脑端 Sryaestart 启动后会自动恢复");
        return;
      }

      setState(
        "error",
        "电脑端服务暂时离线",
        "每 " + RETRY_DELAY / 1000 + " 秒自动检测一次，服务恢复后直接进入"
      );
    } finally {
      busy = false;
      if (!settled) schedule(RETRY_DELAY);
    }
  }

  /* 聚光 Spotlight（02）：卡片高光跟随指针。只在鼠标设备绑定，触屏保留默认光位 */
  (function spotlight() {
    var card = document.querySelector(".card");
    if (!card || !window.matchMedia) return;
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

    var queued = false;
    var px = 0;
    var py = 0;

    function paint() {
      queued = false;
      var rect = card.getBoundingClientRect();
      card.style.setProperty("--mx", (px - rect.left).toFixed(0) + "px");
      card.style.setProperty("--my", (py - rect.top).toFixed(0) + "px");
    }

    card.addEventListener("pointermove", function (event) {
      px = event.clientX;
      py = event.clientY;
      if (queued) return;
      queued = true;
      requestAnimationFrame(paint);
    });

    card.addEventListener("pointerleave", function () {
      card.style.removeProperty("--mx");
      card.style.removeProperty("--my");
    });
  })();

  el.retry.addEventListener("click", function () {
    attempt = 0;
    clearTimeout(timer);
    run();
  });

  window.addEventListener("online", function () {
    if (!settled) { attempt = 0; run(); }
  });

  document.addEventListener("visibilitychange", function () {
    if (!settled && document.visibilityState === "visible") run();
  });

  run();
})();
</script>
</body>
</html>
