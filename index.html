<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sryaestart · 看板直达</title>
  <meta name="description" content="Sryaestart 看板直达入口：自动连接最新服务器，无需填写任何地址。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #05070f; }
    .stars::before, .stars::after {
      content: ""; position: fixed; width: 2px; height: 2px; border-radius: 50%;
      background: rgba(255,255,255,.7); z-index: -3;
    }
    .stars::before {
      box-shadow: 120px 80px 0 rgba(255,255,255,.7), 320px 140px 0 rgba(255,255,255,.5), 540px 60px 0 rgba(255,255,255,.6), 760px 200px 0 rgba(255,255,255,.4), 980px 90px 0 rgba(255,255,255,.7), 1120px 320px 0 rgba(255,255,255,.5), 140px 420px 0 rgba(255,255,255,.5), 430px 520px 0 rgba(255,255,255,.6), 640px 400px 0 rgba(255,255,255,.4), 860px 560px 0 rgba(255,255,255,.5), 1060px 620px 0 rgba(255,255,255,.6), 80px 660px 0 rgba(255,255,255,.4), 300px 780px 0 rgba(255,255,255,.5), 520px 700px 0 rgba(255,255,255,.6), 700px 820px 0 rgba(255,255,255,.4), 920px 760px 0 rgba(255,255,255,.5), 1150px 840px 0 rgba(255,255,255,.4);
    }
    .stars::after {
      box-shadow: 200px 240px 0 rgba(255,255,255,.45), 470px 340px 0 rgba(255,255,255,.5), 690px 180px 0 rgba(255,255,255,.45), 900px 420px 0 rgba(255,255,255,.5), 60px 180px 0 rgba(255,255,255,.5), 1010px 160px 0 rgba(255,255,255,.5), 260px 600px 0 rgba(255,255,255,.45), 580px 640px 0 rgba(255,255,255,.5), 800px 700px 0 rgba(255,255,255,.45), 1100px 480px 0 rgba(255,255,255,.5);
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(130px); z-index: -2; pointer-events: none; }
    .orb-a { width: 460px; height: 460px; top: -140px; left: -100px; background: #8b5cf6; opacity: .16; }
    .orb-b { width: 500px; height: 500px; bottom: -180px; right: -120px; background: #22d3ee; opacity: .13; }
    .spinner {
      width: 42px; height: 42px; margin: 20px auto 0;
      border: 3px solid rgba(255,255,255,.12); border-top-color: #8b5cf6; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen text-slate-200 font-sans antialiased flex items-center justify-center">
  <div class="stars"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <main class="text-center px-4 py-10">
    <img src="https://sryae07.github.io/starwaves/assets/icon-192.png" alt="Sryaestart" class="mx-auto h-20 w-20 rounded-2xl shadow-xl shadow-violet-500/30" />
    <h1 class="mt-5 text-2xl sm:text-3xl font-black tracking-wide">Sryaestart</h1>
    <p class="mt-1 text-sm text-slate-500">看板直达入口 · 自动连接</p>
    <div class="spinner"></div>
    <p id="status" class="mt-4 text-sm text-slate-300">正在连接你的看板…</p>
    <p id="detail" class="mt-1 text-xs text-slate-600"></p>
    <div class="mt-8">
      <a href="https://sryae07.github.io/starwaves/" class="rounded-lg border border-white/15 bg-white/5 px-4 py-2 text-xs text-slate-400 hover:bg-white/10 hover:text-white transition">打开项目主页</a>
    </div>
  </main>

  <script>
    (function () {
      var $ = function (sel) { return document.querySelector(sel); };
      var TIMEOUT = 8000;
      var attempt = 0;

      function probe(url) {
        return new Promise(function (resolve) {
          var img = new Image();
          var done = false;
          var finish = function (ok) { if (!done) { done = true; resolve(ok); } };
          img.onload = function () { finish(true); };
          img.onerror = function () { finish(false); };
          setTimeout(function () { finish(false); }, TIMEOUT);
          img.src = url.replace(/\/+$/, '') + '/assets/icon-192.png?t=' + Date.now();
        });
      }

      function fetchPointer() {
        return fetch('current-server.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { return (d && d.url) ? d.url.replace(/\/+$/, '') : null; })
          .catch(function () { return null; });
      }

      function setStatus(text, detail) {
        $('#status').textContent = text;
        $('#detail').textContent = detail || '';
      }

      async function connect() {
        attempt += 1;
        setStatus('正在连接你的看板…（第 ' + attempt + ' 次）');
        try {
          var cached = localStorage.getItem('sryaestart_server');
          var pointer = await fetchPointer();
          var candidates = [];
          if (cached) candidates.push(cached);
          if (pointer && pointer !== cached) candidates.push(pointer);
          for (var i = 0; i < candidates.length; i++) {
            var ok = await probe(candidates[i]);
            if (ok) {
              localStorage.setItem('sryaestart_server', candidates[i]);
              setStatus('✓ 已连接，正在进入看板…');
              location.replace(candidates[i] + '/dashboard');
              return;
            }
          }
        } catch (err) { /* 重试 */ }
        setStatus('⏳ 电脑服务暂时离线，自动重试中…', '每 6 秒检测一次；电脑端 Sryaestart 恢复后会自动进入看板');
        setTimeout(connect, 6000);
      }

      connect();
    })();
  </script>
</body>
</html>
