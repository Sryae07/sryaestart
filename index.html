<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="color-scheme" content="dark">
<title>Sryaestart · 看板直达</title>
<meta name="description" content="Sryaestart 看板直达入口：自动连接最新服务器，无需填写任何地址。">
<meta property="og:type" content="website">
<meta property="og:title" content="Sryaestart · 看板直达">
<meta property="og:description" content="自动连接最新服务器，无需填写任何地址。">
<meta property="og:image" content="https://sryae07.dpdns.org/icon-192.png">
<meta name="twitter:card" content="summary">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 7l4.2 8.5L16 25l-4.2-9.5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" as="image" href="icon-192.png" fetchpriority="high">
<link rel="preconnect" href="https://dash.sryae07.dpdns.org" crossorigin>

<style>
  html { -webkit-text-size-adjust: 100%; background: #05070f; }
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding:
      max(20px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    overflow-x: hidden;
    background: #05070f;
    color: #e2e8f0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* 背景：纯 CSS 径向渐变，替代原来的 filter: blur(130px) 巨型光球（移动端 GPU 开销高） */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
      radial-gradient(34vmax 34vmax at 4% -10%, rgba(139, 92, 246, .30), transparent 62%),
      radial-gradient(38vmax 38vmax at 108% 110%, rgba(34, 211, 238, .22), transparent 62%),
      radial-gradient(70vmax 44vmax at 50% -20%, rgba(99, 102, 241, .14), transparent 70%),
      radial-gradient(70vmax 70vmax at 50% 130%, rgba(76, 29, 149, .18), transparent 72%);
  }

  /* 星点：平铺渐变，替代 1100px 宽的 box-shadow 星带（手机上大半在视口外） */
  .stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: .9;
    background-image:
      radial-gradient(1.4px 1.4px at 24px 32px, #fff, transparent 100%),
      radial-gradient(1px 1px at 132px 84px, rgba(255, 255, 255, .85), transparent 100%),
      radial-gradient(1.6px 1.6px at 228px 166px, rgba(255, 255, 255, .7), transparent 100%),
      radial-gradient(1px 1px at 92px 204px, rgba(255, 255, 255, .6), transparent 100%),
      radial-gradient(1.2px 1.2px at 300px 46px, rgba(255, 255, 255, .55), transparent 100%);
    background-size: 360px 260px;
    background-repeat: repeat;
    -webkit-mask-image: radial-gradient(120% 90% at 50% 35%, #000 40%, transparent 100%);
    mask-image: radial-gradient(120% 90% at 50% 35%, #000 40%, transparent 100%);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    padding: clamp(26px, 7vw, 36px) clamp(20px, 6vw, 32px);
    text-align: center;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(24, 28, 46, .82), rgba(10, 13, 24, .88));
    box-shadow:
      0 30px 70px -30px rgba(0, 0, 0, .95),
      inset 0 1px 0 rgba(255, 255, 255, .07);
    animation: enter .6s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(10px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  .logo-wrap {
    position: relative;
    display: inline-block;
    line-height: 0;
  }
  .logo-wrap::after {
    content: "";
    position: absolute;
    inset: -11px;
    border: 1px solid rgba(139, 92, 246, .35);
    border-radius: 34px;
    animation: ring 2.8s ease-out infinite;
    pointer-events: none;
  }
  .logo {
    display: block;
    width: 88px;
    height: 88px;
    border-radius: 22px;
    box-shadow: 0 14px 34px -10px rgba(139, 92, 246, .6), 0 0 0 1px rgba(255, 255, 255, .1);
  }
  @keyframes ring {
    0%   { opacity: .8; transform: scale(.94); }
    70%  { opacity: 0;  transform: scale(1.06); }
    100% { opacity: 0;  transform: scale(1.06); }
  }

  h1 {
    margin: 20px 0 0;
    font-size: clamp(1.55rem, 6.4vw, 2rem);
    font-weight: 800;
    letter-spacing: .01em;
    background: linear-gradient(180deg, #fff 35%, rgba(226, 232, 240, .68));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    margin: 7px 0 0;
    font-size: .82rem;
    letter-spacing: .12em;
    color: #7c8698;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    padding: 10px 15px;
    max-width: 100%;
    border: 1px solid rgba(139, 92, 246, .3);
    border-radius: 999px;
    background: rgba(139, 92, 246, .10);
    font-size: .82rem;
    line-height: 1.45;
    color: #c4b5fd;
    transition: color .25s, background-color .25s, border-color .25s;
  }
  .status .dot {
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 0 4px rgba(167, 139, 250, .16);
    animation: pulse 1.7s ease-in-out infinite;
  }
  .status.ok   { color: #6ee7b7; border-color: rgba(52, 211, 153, .32); background: rgba(52, 211, 153, .10); }
  .status.warn { color: #fcd34d; border-color: rgba(251, 191, 36, .30); background: rgba(251, 191, 36, .09); }
  .status.error{ color: #fca5a5; border-color: rgba(248, 113, 113, .28); background: rgba(248, 113, 113, .09); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .45; transform: scale(.82); }
  }

  .bar {
    display: none;
    height: 2px;
    margin: 12px auto 0;
    width: 132px;
    overflow: hidden;
    border-radius: 2px;
    background: rgba(255, 255, 255, .07);
  }
  .bar.show { display: block; }
  .bar span {
    display: block;
    width: 45%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, #a78bfa, #22d3ee, transparent);
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(300%); }
  }

  .detail {
    margin: 14px 0 0;
    min-height: 1.6em;
    font-size: .72rem;
    line-height: 1.7;
    color: #5b6478;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 26px;
  }
  .btn {
    flex: 1 1 140px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 18px;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 13px;
    background: rgba(255, 255, 255, .05);
    color: #cbd5e1;
    font: inherit;
    font-size: .82rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .2s, border-color .2s, color .2s, transform .15s;
  }
  .btn:hover { background: rgba(255, 255, 255, .1); color: #fff; }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
  .btn:disabled {
    opacity: .45;
    cursor: default;
    transform: none;
  }
  .btn:disabled:hover { background: rgba(255, 255, 255, .05); color: #cbd5e1; }
  .btn-primary {
    border-color: rgba(139, 92, 246, .45);
    background: linear-gradient(180deg, rgba(139, 92, 246, .3), rgba(139, 92, 246, .16));
    color: #ede9fe;
  }
  .btn-primary:hover { background: linear-gradient(180deg, rgba(139, 92, 246, .42), rgba(139, 92, 246, .24)); }
  .btn[hidden] { display: none; }

  .hint {
    margin: 18px 0 0;
    font-size: .7rem;
    line-height: 1.7;
    color: #454e60;
  }

  @media (max-width: 360px) {
    .logo { width: 76px; height: 76px; border-radius: 19px; }
    .logo-wrap::after { inset: -9px; border-radius: 28px; }
    .status { font-size: .78rem; padding: 9px 13px; }
    .btn { flex-basis: 100%; font-size: .8rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>

  <main class="card">
    <div class="logo-wrap">
      <img class="logo" src="icon-192.png" width="88" height="88" alt="Sryaestart" fetchpriority="high" decoding="async">
    </div>

    <h1>Sryaestart</h1>
    <p class="sub">看板直达 · 自动连接</p>

    <div class="status" id="statusWrap">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText" role="status" aria-live="polite">正在连接你的看板…</span>
    </div>

    <div class="bar" id="bar" aria-hidden="true"><span></span></div>
    <p class="detail" id="detail"></p>

    <div class="actions">
      <button class="btn btn-primary" id="retry" type="button">立即重试</button>
      <a class="btn" href="https://sryae07.github.io/starwaves/">打开项目主页</a>
    </div>

    <p class="hint">电脑端 Sryaestart 启动后会自动进入，无需刷新页面</p>
    <noscript>
      <p class="detail">需要启用 JavaScript 才能自动连接，也可以直接打开上面的项目主页。</p>
    </noscript>
  </main>

<script>
(function () {
  "use strict";

  /* 固定域名的具名隧道（cloudflared named tunnel），地址永远不变。
     留空字符串则只走 current-server.json 里的一次性地址。 */
  var FIXED_BASE = "https://dash.sryae07.dpdns.org";
  var POINTER_URL = "current-server.json";
  var PROBE_TIMEOUT = 5000;
  var FIXED_PROBE_TIMEOUT = 4000;
  var RETRY_DELAY = 5000;
  var STORE_KEY = "sryaestart_server";

  var el = {
    wrap: document.getElementById("statusWrap"),
    text: document.getElementById("statusText"),
    detail: document.getElementById("detail"),
    bar: document.getElementById("bar"),
    retry: document.getElementById("retry")
  };

  var attempt = 0;
  var settled = false;
  var timer = null;
  var busy = false;

  function readStore() {
    try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; }
  }
  function writeStore(value) {
    try { localStorage.setItem(STORE_KEY, value); } catch (e) { /* 隐私模式下忽略 */ }
  }

  function setState(kind, text, detail) {
    el.wrap.className = "status" + (kind ? " " + kind : "");
    el.text.textContent = text;
    el.detail.textContent = detail || "";
    el.bar.classList.toggle("show", kind === "busy");
    el.retry.disabled = kind === "busy";
  }

  function schedule(ms) {
    clearTimeout(timer);
    timer = setTimeout(run, ms);
  }

  function preconnect(base) {
    try {
      var origin = new URL(base).origin;
      if (!origin || document.querySelector('link[data-preconnect="' + origin + '"]')) return;
      var link = document.createElement("link");
      link.rel = "preconnect";
      link.href = origin;
      link.crossOrigin = "";
      link.setAttribute("data-preconnect", origin);
      document.head.appendChild(link);
    } catch (e) { /* ignore */ }
  }

  function safeUrl(value) {
    if (typeof value !== "string") return null;
    var url = value.trim().replace(/\/+$/, "");
    return /^https?:\/\/[^\s]+$/i.test(url) ? url : null;
  }

  function fetchPointer() {
    var controller = typeof AbortController === "function" ? new AbortController() : null;
    var timerId = controller ? setTimeout(function () { controller.abort(); }, 6000) : null;

    var request = fetch(POINTER_URL + "?t=" + Date.now(), {
      cache: "no-store",
      signal: controller ? controller.signal : undefined
    }).then(function (response) {
      return response.ok ? response.json() : null;
    }).then(function (data) {
      return safeUrl(data && data.url);
    }).catch(function () {
      return null;
    });

    if (!timerId) return request;
    return request.then(function (value) {
      clearTimeout(timerId);
      return value;
    }, function (error) {
      clearTimeout(timerId);
      throw error;
    });
  }

  /* 用一张图片验证服务是否真的活着：图片能解码 = 隧道与后端都通 */
  function probe(base, timeout) {
    return new Promise(function (resolve) {
      var img = new Image();
      var done = false;
      var timeoutId = setTimeout(function () { finish(false); }, timeout || PROBE_TIMEOUT);

      function finish(ok) {
        if (done) return;
        done = true;
        clearTimeout(timeoutId);
        img.onload = img.onerror = null;
        img.src = "data:,";
        resolve(ok);
      }

      img.onload = function () { finish(true); };
      img.onerror = function () { finish(false); };
      img.src = base + "/assets/icon-192.png?t=" + Date.now();
    });
  }

  function goTo(base) {
    settled = true;
    clearTimeout(timer);
    writeStore(base);
    setState("ok", "已连接，正在进入看板…", base.replace(/^https?:\/\//, ""));
    location.replace(base + "/dashboard");
  }

  async function run() {
    if (settled || busy) return;
    busy = true;
    clearTimeout(timer);
    attempt += 1;

    try {
      if (navigator.onLine === false) {
        setState("warn", "当前没有网络连接", "恢复网络后会自动继续");
        return;
      }

      setState(
        "busy",
        attempt === 1 ? "正在连接你的看板…" : "正在重试连接（第 " + attempt + " 次）",
        FIXED_BASE ? "正在连接 dash.sryae07.dpdns.org" : "正在解析最新服务器地址"
      );

      var cached = readStore();
      var candidates = [];
      function add(url) {
        if (url && candidates.indexOf(url) === -1) candidates.push(url);
      }

      /* 固定域名的隧道优先：DNS 不通会立刻失败，不占时间 */
      add(FIXED_BASE);
      if (candidates.length) preconnect(candidates[0]);

      for (var i = 0; i < candidates.length; i++) {
        if (await probe(candidates[i], FIXED_PROBE_TIMEOUT)) {
          goTo(candidates[i]);
          return;
        }
      }

      /* 固定域名没通，再退回 current-server.json 里的一次性地址 */
      add(cached);
      var pointer = await fetchPointer();
      add(pointer);

      for (var j = 0; j < candidates.length; j++) {
        if (j === 0 && FIXED_BASE) continue; /* 刚试过 */
        if (await probe(candidates[j])) {
          goTo(candidates[j]);
          return;
        }
      }

      if (!candidates.length) {
        setState("warn", "暂时没有可用的服务器地址", "电脑端 Sryaestart 启动后会自动恢复");
        return;
      }

      setState(
        "error",
        "电脑端服务暂时离线",
        "每 " + RETRY_DELAY / 1000 + " 秒自动检测一次，服务恢复后直接进入"
      );
    } finally {
      busy = false;
      if (!settled) schedule(RETRY_DELAY);
    }
  }

  el.retry.addEventListener("click", function () {
    attempt = 0;
    clearTimeout(timer);
    run();
  });

  window.addEventListener("online", function () {
    if (!settled) { attempt = 0; run(); }
  });

  document.addEventListener("visibilitychange", function () {
    if (!settled && document.visibilityState === "visible") run();
  });

  run();
})();
</script>
</body>
</html>
