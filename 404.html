<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sryaestart · 页面跳转</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
  html,body{margin:0;min-height:100%;background:#05070f;color:#cbd5e1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:380px;border:1px solid rgba(148,163,184,.18);border-radius:24px;background:rgba(17,24,42,.72);padding:28px 22px;text-align:center}
  h1{font-size:17px;margin:0 0 6px}
  p{font-size:13px;color:#94a3b8;line-height:1.7;margin:0 0 18px}
  a{display:block;text-decoration:none;border-radius:14px;padding:12px;font-size:14px;font-weight:600;margin-top:10px}
  .p{background:linear-gradient(90deg,#8b5cf6,#22d3ee);color:#fff}
  .s{background:rgba(255,255,255,.06);border:1px solid rgba(148,163,184,.2);color:#cbd5e1}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>这里没有页面</h1>
  <p id="hint">正在带你去正确的位置…</p>
  <a class="p" id="to-board" href="/board/">进入看板</a>
  <a class="s" href="/">回到入口页</a>
</div></div>
<script>
(function () {
  var p = location.pathname;
  var m = p.match(/\/share\/([A-Za-z0-9_-]+)/);
  var q = new URLSearchParams(location.search);
  var sid = q.get('share') || (m ? m[1] : null);
  if (sid) { location.replace('/board/share.html?share=' + encodeURIComponent(sid)); return; }
  if (/^\/board\//.test(p)) { location.replace('/board/'); return; }
  document.getElementById('hint').textContent = '地址可能输错了，点下面的按钮继续。';
})();
</script>
</body>
</html>
